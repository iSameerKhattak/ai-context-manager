[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextclaw-shared"
version = "0.1.0"
description = "Shared models and utilities for ContextClaw services"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.30,<1",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.14,<2",
    "ulid-py>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "tree-sitter>=0.24,<1",
    "tree-sitter-python>=0.25,<1",
    "tree-sitter-typescript>=0.23,<1",
    "tree-sitter-go>=0.25,<1",
    "tree-sitter-java>=0.23,<1",
    "gitpython>=3.1,<4",
    "qdrant-client>=1.12,<2",
    "openai>=1.68,<3",
    "aio-pika>=9.5,<10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4.0,<5",
]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "syrupy>=4.7,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
